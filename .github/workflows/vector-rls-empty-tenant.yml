name: vector RLS empty tenant admission

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rls-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22.22.1"
      - name: Prove empty and invalid tenant state fails closed without cast errors
        shell: bash
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const uuid = /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
          const tenant = value => {
            const normalized = value == null ? '' : String(value).trim();
            if (!normalized) return null;
            if (!uuid.test(normalized)) return null;
            return normalized.toLowerCase();
          };
          const visible = (rowTenant, setting) => {
            const scoped = tenant(setting);
            return scoped !== null && scoped === rowTenant.toLowerCase();
          };
          const a = '11111111-1111-4111-8111-111111111111';
          assert.equal(tenant(''), null);
          assert.equal(tenant('   '), null);
          assert.equal(tenant('not-a-uuid'), null);
          assert.equal(visible(a, ''), false);
          assert.equal(visible(a, 'not-a-uuid'), false);
          assert.equal(visible(a, a), true);
          assert.equal(visible(a, '22222222-2222-4222-8222-222222222222'), false);
          NODE